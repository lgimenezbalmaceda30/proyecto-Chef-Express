/* SESIÓN PERSISTENTE (12 h): evita re-loguear en cada apertura de la PWA.
   Se guarda solo el id; el usuario se rebusca en la lista actualizada,
   así los cambios de permisos hechos por el admin se aplican al restaurar. */
const SESSION_HS=12;
const restoreSession=()=>{
  const s=LS.get("_session",null);
  if(!s||!s.id) return null;
  if(Date.now()-s.ts>SESSION_HS*3600*1000){ LS.del("_session"); return null; }
  return LS.get("users").find(u=>u.id===s.id)||null;
};

/* APP */
function App(){
  const [user,setUser]=useState(null);
  const [screen,setScreen]=useState("home");
  const [syncing,setSyncing]=useState(SUPA_READY);
  const [syncErr,setSyncErr]=useState(false);
  const [obN,setObN]=useState(0); // registros pendientes de subir (outbox)

  // Al abrir: 1) reintentar lo pendiente de subir, 2) bajar datos frescos, 3) restaurar sesión
  useEffect(()=>{
    if(!SUPA_READY){ setUser(restoreSession()); setSyncing(false); return; }
    let alive=true;
    obFlush().then(()=>pullAll()).then(ok=>{ if(!alive)return; setSyncErr(!ok); setUser(restoreSession()); setSyncing(false); });
    return ()=>{alive=false;};
  },[]);

  // Refresco periódico del contador de pendientes del outbox
  useEffect(()=>{
    const upd=()=>setObN(obGet().length);
    upd();
    const t=setInterval(upd,10000);
    return ()=>clearInterval(t);
  },[]);

  const login=u=>{ LS.set("_session",{id:u.id,ts:Date.now()}); setUser(u); };
  const logout=()=>{ LS.del("_session"); setUser(null); setScreen("home"); };
  const retryOutbox=()=>{ obFlush().then(()=>setObN(obGet().length)); };

  if(syncing) return (
    <div style={{minHeight:"100vh",background:B.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
      <img src={B.logo} alt="Chefexprés" style={{height:46,objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>
      <div style={{color:B.muted,fontSize:13}}>Sincronizando datos…</div>
    </div>
  );

  if(!user) return <Login onLogin={login} syncErr={syncErr}/>;
  const guard=(perm,node)=> perm ? node : <div style={{color:B.red,padding:20,textAlign:"center"}}>Sin acceso a esta sección.</div>;
  const content=()=>{
    switch(screen){
      case "home":     return <Dashboard user={user} setScreen={setScreen}/>;
      case "mp":       return guard(can(user,"mp"),<IngresoMP user={user}/>);
      case "rellenos": return guard(can(user,"rellenos"),<ProduccionScreen user={user} cfg={CFGS.rellenos}/>);
      case "masas":    return guard(can(user,"masas"),<ProduccionScreen user={user} cfg={CFGS.masas}/>);
      case "semi":     return guard(can(user,"semi"),<ProduccionScreen user={user} cfg={CFGS.semi}/>);
      case "pt":       return guard(can(user,"pt"),<ProduccionScreen user={user} cfg={CFGS.pt}/>);
      case "anulaciones": return guard(can(user,"aprobar"),<Anulaciones user={user}/>);
      case "traze":    return guard(can(user,"traze"),<Trazabilidad/>);
      case "efic":     return guard(can(user,"efic"),<Eficiencia/>);
      case "exportar": return guard(can(user,"exportar"),<Exportar/>);
      case "cap":      return <Capacitacion user={user}/>;
      case "limpieza": return guard(can(user,"limpieza"),<Limpiezas user={user}/>);
      case "insumoslimp": return guard(can(user,"insumoslimp"),<InsumosLimpieza user={user}/>);
      case "config":   return guard(user.esAdmin,<Configuracion/>);
      case "zonas":    return guard(user.esAdmin,<ConfigZonas/>);
      case "usuarios": return guard(user.esAdmin,<Usuarios currentUser={user}/>);
      default:         return <Dashboard user={user} setScreen={setScreen}/>;
    }
  };
  return (
    <div style={{minHeight:"100vh",background:B.bg}}>
      <div style={{background:B.surface,borderBottom:`1px solid ${B.border}`,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>{screen!=="home"&&<button onClick={()=>setScreen("home")} style={{background:"none",border:"none",color:B.accent,fontSize:22,cursor:"pointer",padding:0,lineHeight:1}}>‹</button>}<img src={B.logo} alt="Chefexprés" style={{height:32,objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>{ENV==="testing"?<span style={{color:B.yellow,fontSize:10,fontWeight:700,background:"#3D2C00",padding:"1px 6px",borderRadius:4}}>TESTING</span>:<span style={{color:B.accent,fontSize:10,fontWeight:700,background:B.accentD,padding:"1px 6px",borderRadius:4}}>PRODUCCIÓN</span>}{!SUPA_READY&&<span style={{color:B.muted,fontSize:10,fontWeight:700,background:B.card,padding:"1px 6px",borderRadius:4}}>SIN CONECTAR</span>}{obN>0&&<span onClick={retryOutbox} title="Registros guardados en este dispositivo que aún no llegaron a la nube. Tocá para reintentar." style={{color:B.amber,fontSize:10,fontWeight:700,background:"#3D2C00",padding:"1px 6px",borderRadius:4,cursor:"pointer"}}>⏳ {obN} sin subir</span>}</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{textAlign:"right"}}><div style={{fontSize:11,fontWeight:700,color:B.text}}>{user.nombre}</div><div style={{fontSize:10,color:B.muted}}>{user.esAdmin?"Administrador":"Operativo"}</div></div><button onClick={logout} style={{background:B.card,border:`1px solid ${B.border}`,borderRadius:6,padding:"3px 8px",color:B.muted,fontSize:11,cursor:"pointer"}}>Salir</button></div>
      </div>
      <div style={{maxWidth:680,margin:"0 auto",padding:"20px 14px 40px"}}>{content()}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>
</body>
</html>
