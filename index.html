/* ============================================================
   OUTBOX: cola de sincronización pendiente.
   ------------------------------------------------------------
   Todo push que falla (sin red, error de RLS o GRANT) se encola
   acá y se reintenta: al abrir la app (ANTES del pullAll, para que
   la nube no pise datos locales aún no subidos), al volver la
   conexión (evento "online") y a mano desde el badge del header.
   Sin esto, un registro cargado offline se perdía en el próximo
   pullAll. Los reintentos son idempotentes (upsert por id).
   ============================================================ */
const obGet=()=>LS.get("_outbox",[]);
const obSet=q=>LS.set("_outbox",q);
const obAdd=op=>{ const q=obGet(); q.push({...op,_ts:new Date().toISOString()}); obSet(q); console.warn("outbox: encolado para reintento →",op.fn,op.store||""); };

// Ejecuta una operación contra Supabase. Devuelve true solo si la nube la aceptó.
async function execOp(op){
  if(!sb) return false;
  try{
    switch(op.fn){
      case "rows":      return await execPushRows(op.store,op.items);
      case "zona":      { const {error}=await sb.from("zonas_limpieza").upsert(op.row,{onConflict:"id"}); if(error)console.warn("zona",error.message); return !error; }
      case "delzona":   { const {error}=await sb.from("zonas_limpieza").delete().eq("id",op.id); if(error)console.warn("delzona",error.message); return !error; }
      case "limpieza":  { const {error}=await sb.from("registros_limpieza").upsert(op.row,{onConflict:"id"}); if(error)console.warn("limpieza",error.message); return !error; }
      case "insumo":    { const {error}=await sb.from("insumos_limpieza").upsert(op.row,{onConflict:"id"}); if(error)console.warn("insumo",error.message); return !error; }
      case "catalogos": { const {error}=await sb.from("catalogos").upsert(op.row,{onConflict:"empresa_id"}); if(error)console.warn("catalogos",error.message); return !error; }
      case "user":      { const {error}=await sb.from("usuarios").upsert(op.row,{onConflict:"id"}); if(error)console.warn("user",error.message); return !error; }
      case "deluser":   { const {error}=await sb.from("usuarios").delete().eq("id",op.id); if(error)console.warn("deluser",error.message); return !error; }
      case "ranking":   { const {error}=await sb.from("ranking").upsert(op.row,{onConflict:"empresa_id,usuario_id"}); if(error)console.warn("ranking",error.message); return !error; }
      default: return true;
    }
  }catch(e){ console.warn("execOp",op.fn,e.message); return false; }
}
// Intenta ejecutar; si falla, encola para reintento posterior.
async function syncOp(op){ if(!sb) return false; const ok=await execOp(op); if(!ok) obAdd(op); return ok; }
// Reintenta todo lo pendiente en orden. Lo que sigue fallando queda en cola.
let _flushing=false;
async function obFlush(){
  if(!sb||_flushing) return;
  _flushing=true;
  try{
    const q=obGet(); if(!q.length) return;
    const rest=[];
    for(const op of q){ const ok=await execOp(op); if(!ok) rest.push(op); }
    obSet(rest);
    console.info(rest.length===0?"outbox: todo sincronizado ✓":`outbox: quedan ${rest.length} pendiente(s)`);
  } finally { _flushing=false; }
}
window.addEventListener("online",()=>obFlush());

/* ============================================================
   CAPA DE SINCRONIZACIÓN CON SUPABASE (Camino B)

   ============================================================ */

// Mapeo de campos entre el modelo local y las columnas de Supabase.
// Las tablas de producción guardan timestamp_inicio/fin; en la base son ts_inicio/fin.

};
// Traducción inversa: fila de Supabase → objeto local
const fromRow = {
  mp:(r)=>({ id:r.id, proveedor:r.proveedor, material:r.material, lote:r.lote, cantidad:r.cantidad, unidad:r.unidad,
    fecha_vto:r.fecha_vto, obs:r.obs, remito:r.remito, retrasada:r.retrasada, timestamp:r.ts_ingreso, ts_carga:r.ts_carga,
    demora_min:r.demora_min, condiciones:r.condiciones, cantidad_consumida:r.cantidad_consumida,
    cantidad_scrap:r.cantidad_scrap, unidad_scrap:r.unidad_scrap, operario:r.operario, estado:r.estado, anulacion:r.anulacion }),
  prod:(r)=>({ id:r.id, tipo:r.tipo, lote:r.lote, cantidad:r.cantidad, unidad:r.unidad, fecha_vto:r.fecha_vto, obs:r.obs,
    cantidad_consumida:r.cantidad_consumida, cantidad_scrap:r.cantidad_scrap, unidad_scrap:r.unidad_scrap,
    operario:r.operario, estado:r.estado, anulacion:r.anulacion,
    timestamp_inicio:r.ts_inicio, timestamp_fin:r.ts_fin }),
};
const PROD_STORES=["rellenos","masas","semi","pt"];
const rowMapper = store => store==="mp" ? toRow.mp : toRow.prod;
const objMapper = store => store==="mp" ? fromRow.mp : fromRow.prod;

// Ejecutor real: sube ítems de un store (upsert por id) + sus consumos.
// Devuelve true SOLO si todo llegó a la nube. Todos los errores se chequean
// y loguean (clave para detectar GRANTs faltantes en tablas nuevas).
async function execPushRows(store, items){
  const rows = items.map(rowMapper(store));
  const { error } = await sb.from(store).upsert(rows, { onConflict:"id" });
  if(error){ console.warn("push "+store, error.message); return false; }
  for(const it of items){
    if(it.consumo && Object.keys(it.consumo).length){
      const crows = Object.entries(it.consumo).map(([origenId,c])=>({
        empresa_id:EMPRESA_ID, destino_tabla:store, destino_id:it.id,
        origen_tabla:c.store, origen_id:origenId, cantidad:c.cantidad,
        // unidad desnormalizada desde el ítem origen (útil para el futuro módulo de stock)
        unidad:(LS.get(c.store).find(x=>x.id===origenId)||{}).unidad||null,
      }));
      // borrar consumos previos de ese destino y recargar (simple, consistente e idempotente)
      const d = await sb.from("consumos").delete().eq("empresa_id",EMPRESA_ID).eq("destino_tabla",store).eq("destino_id",it.id);
      if(d.error){ console.warn("push consumos (delete)", d.error.message); return false; }
      const ins = await sb.from("consumos").insert(crows);
      if(ins.error){ console.warn("push consumos (insert)", ins.error.message); return false; }
    }
  }
  return true;
}
// API usada por la app: intenta subir; si falla, queda encolado en el outbox.
async function pushRows(store, items){
  if(!sb) return;
  await syncOp({fn:"rows", store, items});
}

// Baja todos los datos de Supabase y los vuelca al LS (caché local)
async function pullAll(){
  if(!sb) return false;
  try{
    // catálogos
    const cat = await sb.from("catalogos").select("data").eq("empresa_id",EMPRESA_ID).maybeSingle();
    if(cat.data && cat.data.data) LS.set("catalogos", cat.data.data);
    // usuarios
    const us = await sb.from("usuarios").select("*").eq("empresa_id",EMPRESA_ID);
    if(us.data) LS.set("users", us.data.map(u=>({ id:u.id, usr:u.usr, pw:u.pw, nombre:u.nombre, esAdmin:u.es_admin, permisos:u.permisos||{} })));
    // mp + producción (reconstruyendo consumo desde tabla consumos)
    const cons = await sb.from("consumos").select("*").eq("empresa_id",EMPRESA_ID);
    const consByDest = {};
    (cons.data||[]).forEach(c=>{ const k=c.destino_tabla+":"+c.destino_id; (consByDest[k]=consByDest[k]||{})[c.origen_id]={cantidad:Number(c.cantidad),store:c.origen_tabla}; });
    // Mapa de campo _ids por tabla origen, para reconstruir las relaciones de la cadena
    const IDS_FIELD = { mp:"mp_ids", rellenos:"relleno_ids", masas:"masa_ids", semi:"semi_ids" };
    for(const store of ["mp",...PROD_STORES]){
      const res = await sb.from(store).select("*").eq("empresa_id",EMPRESA_ID);
      if(res.data){
        const map = objMapper(store);
        const items = res.data.map(r=>{
          const o=map(r); const k=store+":"+r.id;
          if(consByDest[k]){
            o.consumo=consByDest[k];
            // reconstruir los _ids agrupando por tabla de origen (necesario para getChain)
            Object.entries(consByDest[k]).forEach(([origenId,info])=>{
              const f=IDS_FIELD[info.store]; if(!f) return;
              (o[f]=o[f]||[]).push(origenId);
            });
          }
          return o;
        }).sort((a,b)=>{ const ta=a.timestamp||a.timestamp_inicio||"", tb=b.timestamp||b.timestamp_inicio||""; return ta<tb?1:-1; });
        // No pisar registros locales que siguen pendientes de subir (outbox):
        // la versión local gana hasta que logre sincronizarse.
        obGet().filter(o=>o.fn==="rows"&&o.store===store).flatMap(o=>o.items).forEach(p=>{
          const idx=items.findIndex(x=>x.id===p.id);
          if(idx>=0) items[idx]=p; else items.unshift(p);
        });
        LS.set(store, items);
      }
    }
    // ranking
    const rk = await sb.from("ranking").select("*").eq("empresa_id",EMPRESA_ID);
    if(rk.data) LS.set("ranking", rk.data.map(r=>({ userId:r.usuario_id, nombre:r.nombre, mejorPct:r.mejor_pct, intentos:r.intentos, ultima:r.ultima })));
    // zonas de limpieza
    const zl = await sb.from("zonas_limpieza").select("*").eq("empresa_id",EMPRESA_ID).order("created_at",{ascending:true});
    if(zl.data) LS.set("zonas_limpieza", zl.data.map(z=>({ id:z.id, nombre:z.nombre, poes:z.poes, items:z.items||[], activo:z.activo })));
    // registros de limpieza
    const rl = await sb.from("registros_limpieza").select("*").eq("empresa_id",EMPRESA_ID).order("ts_registro",{ascending:false});
    if(rl.data){
      const arr = rl.data.map(r=>({ id:r.id, zona_id:r.zona_id, zona_nombre:r.zona_nombre, poes:r.poes, items_ok:r.items_ok||[], observaciones:r.observaciones, operario:r.operario, ts_registro:r.ts_registro }));
      obGet().filter(o=>o.fn==="limpieza").forEach(o=>{ if(!arr.some(x=>x.id===o.row.id)) arr.unshift(o.row); });
      LS.set("registros_limpieza", arr);
    }
    // insumos de limpieza
    const il = await sb.from("insumos_limpieza").select("*").eq("empresa_id",EMPRESA_ID).order("ts_ingreso",{ascending:false});
    if(il.data){
      const arr = il.data.map(r=>({ id:r.id, insumo:r.insumo, proveedor:r.proveedor, lote:r.lote, remito:r.remito, cantidad:r.cantidad, unidad:r.unidad, fecha_vto:r.fecha_vto, apto_alimenticio:r.apto_alimenticio, nro_certificado:r.nro_certificado, obs:r.obs, operario:r.operario, estado:r.estado, ts_ingreso:r.ts_ingreso }));
      obGet().filter(o=>o.fn==="insumo").forEach(o=>{ if(!arr.some(x=>x.id===o.row.id)) arr.unshift(o.row); });
      LS.set("insumos_limpieza", arr);
    }
    LS.set("_lastsync", new Date().toISOString());
    return true;
  }catch(e){ console.warn("pullAll", e.message); return false; }
}

/* MIGRACIÓN: normaliza usuarios de versiones viejas sin borrar datos.
   Corrige usuarios que quedaron sin esAdmin/permisos (formato antiguo). */
const DATA_VERSION = 4;
(function migrateUsers(){
  const ALLPERM=[...PERM_CARGA,...PERM_FUNC].map(p=>p.k);
  const allTrue=Object.fromEntries(ALLPERM.map(k=>[k,true]));
  const cargaTrue=Object.fromEntries(ALLPERM.map(k=>[k,["mp","rellenos","masas","semi","pt"].includes(k)]));
  let users=LS.get("users",[]);
  users=users.map(u=>{
    const esAdmin=(typeof u.esAdmin==="boolean")?u.esAdmin:(u.usr==="admin"||u.rol==="admin");
    let permisos=(u.permisos&&typeof u.permisos==="object")?{...u.permisos}
      :((u.rol==="admin"||u.rol==="supervisor"||esAdmin)?{...allTrue}:{...cargaTrue});
    ALLPERM.forEach(k=>{ if(typeof permisos[k]!=="boolean") permisos[k]=false; });
    const {rol,...rest}=u; // descartar campo viejo "rol"
    return {...rest,esAdmin,permisos};
  });
  // Garantizar que siempre exista al menos un administrador
  if(!users.some(u=>u.esAdmin)){
    const a=users.find(u=>u.usr==="admin");
    if(a) a.esAdmin=true; else users.unshift(USERS_DEF[0]);
  }
  LS.set("users",users);
  localStorage.setItem(KEY("dataver"),String(DATA_VERSION));
})();

/* ===== TRAZABILIDAD BIDIRECCIONAL (desde cualquier punto) ===== */
const STORES_ORDER=["mp","rellenos","masas","semi","pt"];
const STORE_META={
  mp:      {label:"Materia prima",  emoji:"📦", color:"#60A5FA", idsField:null},
  rellenos:{label:"Relleno",        emoji:"🥩", color:"#F59E0B", idsField:"relleno_ids", src:["mp"]},

const itemName=(store,i)=> store==="mp" ? i.material : i.tipo;
const itemTs=i=> i.timestamp||i.timestamp_inicio||"";
// devuelve el store al que pertenece un id (busca en todas las tablas)
const findItem=(id)=>{ for(const s of STORES_ORDER){ const it=LS.get(s).find(x=>x.id===id); if(it) return {store:s,item:it}; } return null; };

// HACIA ATRÁS: qué consumió este ítem (sus fuentes). Devuelve por store.
const traceBack=(store,item)=>{
  const meta=STORE_META[store];
  const res={};
  if(!meta.src) return res;
  const fieldByStore={mp:"mp_ids",rellenos:"relleno_ids",masas:"masa_ids",semi:"semi_ids"};
  meta.src.forEach(srcStore=>{
    const f=fieldByStore[srcStore];
    const ids=item[f]||[];
    const items=LS.get(srcStore).filter(x=>ids.includes(x.id));
    if(items.length) res[srcStore]=items;
  });
  return res;
};

// HACIA ADELANTE: en qué se usó este ítem (sus destinos). Busca quién lo tiene en sus _ids.
const traceForward=(store,item)=>{
  const fieldByStore={mp:"mp_ids",rellenos:"relleno_ids",masas:"masa_ids",semi:"semi_ids"};
  const f=fieldByStore[store];
  if(!f) return {}; // pt no tiene destino interno
  const res={};
  // posibles destinos: rellenos/masas consumen mp; semi consume rellenos/masas; pt consume semi
  const destByStore={mp:["rellenos","masas"],rellenos:["semi"],masas:["semi"],semi:["pt"]};
  (destByStore[store]||[]).forEach(destStore=>{
    const items=LS.get(destStore).filter(x=>(x[f]||[]).includes(item.id));
    if(items.length) res[destStore]=items;
  });
  return res;
};

// Construye la descendencia completa hacia adelante (todos los niveles hasta PT)
const forwardChain=(store,item)=>{
  const out={rellenos:[],masas:[],semi:[],pt:[]};
  const seen=new Set();
  const walk=(s,it)=>{
    const fwd=traceForward(s,it);
    Object.entries(fwd).forEach(([ds,items])=>{
      items.forEach(d=>{
        const key=ds+":"+d.id; if(seen.has(key))return; seen.add(key);
        out[ds].push(d); walk(ds,d);
      });
    });
  };
  walk(store,item);
  // dedup
  Object.keys(out).forEach(k=>{ const m={}; out[k].forEach(x=>m[x.id]=x); out[k]=Object.values(m); });
  return out;
};

// Construye los ancestros completos hacia atrás (todos los niveles hasta MP)
const backwardChain=(store,item)=>{
  const out={semi:[],rellenos:[],masas:[],mp:[]};
  const seen=new Set();
  const walk=(s,it)=>{
    const bk=traceBack(s,it);
    Object.entries(bk).forEach(([ss,items])=>{
      items.forEach(a=>{
        const key=ss+":"+a.id; if(seen.has(key))return; seen.add(key);
        if(out[ss]) out[ss].push(a); walk(ss,a);
      });
    });
  };
  walk(store,item);
  Object.keys(out).forEach(k=>{ const m={}; out[k].forEach(x=>m[x.id]=x); out[k]=Object.values(m); });
  return out;
};

/* Caja de anulación reutilizable */
function AnulBox({item,user,store,onChange}){
  const [show,setShow]=useState(false);
  const [motivo,setMotivo]=useState("");
  if(!item||item.estado==="anulado") return null;
  const pend=item.anulacion&&item.anulacion.estado==="pendiente";
  if(pend) return (
    <div style={{...css.card,padding:"12px 14px",marginTop:10,borderColor:`${B.yellow}50`}}>
      <div style={{color:B.yellow,fontWeight:700,fontSize:13}}>⏳ Anulación pendiente de aprobación</div>
      <div style={{color:B.muted,fontSize:12,marginTop:4}}>Solicitada por {item.anulacion.solicitante} · {fmt(item.anulacion.solicitud_ts)}</div>
      <div style={{color:B.text,fontSize:12,marginTop:4}}>Motivo: {item.anulacion.motivo_solicitud}</div>
    </div>
  );
  const directo=can(user,"aprobar");
  return (
    <div style={{marginTop:10}}>
      {item.anulacion&&item.anulacion.estado==="rechazada"&&(
        <div style={{...css.card,padding:"10px 14px",marginBottom:8,borderColor:`${B.muted}40`}}>
          <div style={{color:B.muted,fontSize:12}}>Anulación rechazada por {item.anulacion.resuelto_por}: {item.anulacion.motivo_resolucion}</div>
        </div>
      )}
      {!show&&<button style={{...css.btnDanger,width:"100%"}} onClick={()=>setShow(true)}>{directo?"⛔ Anular registro":"⛔ Solicitar anulación"}</button>}
      {show&&(
        <div style={{...css.card,padding:14,borderColor:`${B.red}40`}}>
          <div style={{color:B.red,fontWeight:700,marginBottom:8,fontSize:13}}>{directo?"Confirmar anulación":"Solicitar anulación"}</div>
          {!directo&&<div style={{color:B.muted,fontSize:12,marginBottom:8}}>Un supervisor deberá aprobarla.</div>}
          <textarea value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="Motivo obligatorio..." rows={3} style={{...css.input,resize:"vertical",marginBottom:10}}/>
          <div style={{display:"flex",gap:8}}>
            <button style={{...css.btn,flex:1,background:B.red,color:"#fff"}} onClick={()=>{ if(!motivo.trim())return alert("El motivo es obligatorio"); const upd=requestAnul(store,item.id,user,motivo); onChange(upd); setShow(false); setMotivo(""); }}>{directo?"Confirmar":"Enviar solicitud"}</button>
            <button style={{...css.btnSm,flex:1}} onClick={()=>{setShow(false);setMotivo("");}}>Cancelar</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AnulInfo({item}){
  if(!item||item.estado!=="anulado"||!item.anulacion) return null;
  const a=item.anulacion;

          <div style={{width:44,height:24,borderRadius:12,background:form.retrasada?B.yellow:B.subtle,position:"relative",flexShrink:0}}><div style={{position:"absolute",top:2,left:form.retrasada?22:2,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/></div>

  const makeF0=()=>({tipo:tipos[0]||"",lote:"",unidad:cfg.unidades[0],obs:"",fecha_vto:"",sources:Object.fromEntries(cfg.sources.map(s=>[s.store,{}]))});

  const cambiar=(id,estado)=>{ const upd=items.map(i=>i.id===id?{...i,estado}:i); LS.set(cfg.store,upd); refresh(upd); pushRows(cfg.store,upd.filter(i=>i.id===id)); };
  // Buscador por fuente: { [store]: "texto" }
  const [busca,setBusca]=useState({});

  if(view==="form") return (
    <div>
      <button style={css.back} onClick={()=>setView("list")}>← Volver</button>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:20}}>{cfg.emoji} Nuevo/a {cfg.label}</div>
      {tipos.length===0&&<div style={{...css.card,padding:14,marginBottom:14,borderColor:`${B.amber}50`,color:B.amber,fontSize:13}}>⚠️ No hay tipos configurados. El admin debe cargarlos en Configuración.</div>}
      <Field label="Tipo *"><select style={css.input} value={form.tipo} onChange={uf("tipo")}>{tipos.map(t=><option key={t}>{t}</option>)}</select></Field>
      <div style={{display:"flex",gap:10}}>
        <div style={{flex:2}}><Field label="N° Lote *"><input style={css.input} value={form.lote} onChange={uf("lote")} placeholder="CE-XX-001"/></Field></div>

      </div>

      {cfg.hasVto&&<Field label="Fecha de vencimiento"><input style={css.input} type="date" value={form.fecha_vto} onChange={uf("fecha_vto")}/></Field>}
      {cfg.sources.map(src=>{
        const q=(busca[src.store]||"").toLowerCase().trim();
        // Disponibles, ordenados por más antiguo primero (PEPS)
        let avail=LS.get(src.store).filter(src.avail);
        const ts=i=>i.timestamp||i.timestamp_inicio||"";
        avail.sort((a,b)=>ts(a)<ts(b)?-1:1);
        if(q) avail=avail.filter(i=>(`${src.name(i)} ${i.lote||""}`).toLowerCase().includes(q));
        const totalDisp=LS.get(src.store).filter(src.avail).length;
        const vence=i=>{ if(!i.fecha_vto) return null; const d=Math.ceil((new Date(i.fecha_vto)-Date.now())/86400000); return d; };
        return (
          <div key={src.store}>
            <div style={css.sec}>{src.emoji} {src.label}</div>
            {totalDisp>3&&(
              <input value={busca[src.store]||""} onChange={e=>setBusca(p=>({...p,[src.store]:e.target.value}))}
                placeholder={`🔍 Buscar ${src.label.toLowerCase()} por nombre o lote...`}

            )}
            <div style={{color:B.subtle,fontSize:11,marginBottom:8}}>↑ Ordenados del más antiguo al más nuevo (consumí primero el de arriba — PEPS)</div>
            {avail.length===0&&<div style={{color:B.muted,fontSize:13,marginBottom:12}}>{q?"Sin resultados para la búsqueda.":`Sin ${src.label.toLowerCase()} terminados disponibles. Solo se pueden consumir ítems ya finalizados.`}</div>}
            {avail.map(item=>{
              const sel=item.id in (form.sources[src.store]||{});
              const qty=form.sources[src.store]?.[item.id]??"";
              const disp=srcAvail(item); // number o null (si aún en proceso)
              const exceso=sel&&qty!==""&&disp!==null&&parseFloat(qty)>disp;
              const dv=vence(item);
              return (
                <div key={item.id} style={{...css.card,padding:"11px 13px",marginBottom:8,borderColor:exceso?B.amber:sel?B.accent:B.border}}>
                  <div onClick={()=>togSrc(src.store,item.id)} style={{cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{color:B.text,fontSize:13,fontWeight:700}}>{src.name(item)}</div>
                      <div style={{color:B.muted,fontSize:11}}>{src.sub(item)} · por {item.operario}</div>
                      {item.fecha_vto&&<div style={{fontSize:11,marginTop:2,color:dv!==null&&dv<=7?B.amber:B.subtle}}>📅 Vence {item.fecha_vto}{dv!==null&&dv<=7?` · en ${dv}d`:""}</div>}
                    </div>
                    <div style={{width:20,height:20,borderRadius:4,border:`2px solid ${B.accent}`,background:sel?B.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#0A1A0C",fontSize:13,fontWeight:800,flexShrink:0}}>{sel?"✓":""}</div>
                  </div>
                  {sel&&(
                    <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${B.border}`}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{color:B.muted,fontSize:12,whiteSpace:"nowrap"}}>Cantidad usada:</span>
                        <input type="number" value={qty} onChange={e=>setSrcQty(src.store,item.id,e.target.value)} placeholder="0" style={{...css.input,padding:"7px 10px",width:90}}/>
                        <span style={{color:B.muted,fontSize:12}}>{item.unidad}{disp!==null?` · disp. ${disp}`:""}</span>

                      {exceso&&<div style={{color:B.amber,fontSize:11,marginTop:6}}>⚠️ Estás usando {qty} pero el lote tenía {disp} {item.unidad}. Revisá si corresponde sumar otro lote.</div>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
      <Field label="Observaciones" mb={12}><textarea style={{...css.input,resize:"vertical"}} rows={2} value={form.obs} onChange={uf("obs")}/></Field>
      <div style={{color:B.muted,fontSize:12,marginBottom:14}}>⏱ Inicio se registra automáticamente · por {user.nombre}</div>
      <button style={css.btn} onClick={save}>Iniciar {cfg.label}</button>

  );

  if(view==="detail"&&sel) return (
    <div>
      <button style={css.back} onClick={()=>setView("list")}>← Volver</button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div><div style={{color:B.text,fontSize:18,fontWeight:800}}>{sel.tipo}</div><div style={{color:B.muted,fontSize:12}}>Lote: {sel.lote}</div></div>
        {statusBadge(sel.estado)}
      </div>
      <AnulInfo item={sel}/>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
        {[["Cantidad producida",sel.cantidad!=null?`${sel.cantidad} ${sel.unidad}`:"Pendiente (al terminar)"],["Cargado por",sel.operario],["Inicio",fmt(sel.timestamp_inicio)],["Fin",sel.timestamp_fin?fmt(sel.timestamp_fin):"En curso"],sel.fecha_vto&&["Vto",sel.fecha_vto]].filter(Boolean).map(([l,v])=>(
          <div key={l} style={{...css.card,padding:"9px 12px",flex:1,minWidth:100}}><div style={{color:B.muted,fontSize:10}}>{l}</div><div style={{color:B.text,fontWeight:700,fontSize:12}}>{v}</div></div>

        <div style={{...css.card,padding:14,marginBottom:8,borderColor:`${B.green}50`}}>
          <div style={{color:B.green,fontWeight:700,fontSize:13,marginBottom:8}}>Cantidad real producida</div>

            <span style={{color:B.muted,fontSize:14,fontWeight:700}}>{sel.unidad}</span>

          <div style={{display:"flex",gap:8}}>
            <button style={{...css.btn,flex:1,background:B.green,color:"#fff"}} onClick={()=>{ if(!finQty||parseFloat(finQty)<=0) return alert("Ingresá la cantidad producida"); finalizar(sel.id,finQty); }}>Confirmar y cerrar</button>

      {sel.estado==="terminado"&&cfg.hasLib&&<div style={{display:"flex",gap:8,marginBottom:8}}><button style={{...css.btn,flex:1,background:B.green,color:"#fff"}} onClick={()=>cambiar(sel.id,"liberado")}>✓ Liberar</button><button style={{...css.btn,flex:1,background:B.red,color:"#fff"}} onClick={()=>cambiar(sel.id,"cuarentena")}>⚠ Cuarentena</button></div>}
      {sel.estado==="cuarentena"&&cfg.hasLib&&(
        <div style={{marginBottom:8}}>
          <div style={{color:B.muted,fontSize:12,marginBottom:8}}>Resuelta la cuarentena, definí el destino del lote:</div>
          <div style={{display:"flex",gap:8}}>
            <button style={{...css.btn,flex:1,background:B.green,color:"#fff"}} onClick={()=>cambiar(sel.id,"liberado")}>✓ Liberar (análisis OK)</button>
            <button style={{...css.btn,flex:1,background:B.card,color:B.text,border:`1px solid ${B.border}`}} onClick={()=>cambiar(sel.id,"terminado")}>↩ Volver a terminado</button>

      {sel.estado==="liberado"&&cfg.hasLib&&<button style={{...css.btnSm,width:"100%",marginBottom:8}} onClick={()=>cambiar(sel.id,"cuarentena")}>⚠ Enviar a cuarentena</button>}

  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{color:B.text,fontSize:18,fontWeight:800}}>{cfg.emoji} {cfg.label}s</div>
        <button style={{...css.btnSm,color:B.accent,borderColor:B.accent+"40"}} onClick={()=>{setForm(makeF0());setView("form");}}>+ Nuevo/a</button>
      </div>
      {items.length===0&&<div style={{color:B.muted,textAlign:"center",padding:40}}>Sin registros aún.</div>}
      {items.length>4&&<input value={busca.__list||""} onChange={e=>setBusca(p=>({...p,__list:e.target.value}))} placeholder={`🔍 Buscar ${cfg.label.toLowerCase()} por tipo, lote, fecha u operario...`} style={{...css.input,marginBottom:12}}/>}
      {items.filter(item=>{ const t=(busca.__list||"").toLowerCase().trim(); return !t||(`${item.tipo} ${item.lote} ${item.operario||""} ${fechaBuscable(item.timestamp_inicio)}`).toLowerCase().includes(t); }).slice().sort((a,b)=>{ const pa=a.estado==="cuarentena"?0:1, pb=b.estado==="cuarentena"?0:1; return pa-pb; }).map(item=>{

        return (
          <div key={item.id} onClick={()=>{setSel(item);setView("detail");}} style={{...css.card,padding:"13px 14px",marginBottom:10,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",opacity:item.estado==="anulado"?0.4:1,borderColor:pend?`${B.yellow}50`:item.estado==="anulado"?`${B.red}30`:item.estado==="cuarentena"?`${B.red}50`:B.border}}>

            <div>{statusBadge(item.estado)}</div>

}

/* ANULACIONES (aprobadores) */
function Anulaciones({user}){
  const [tick,setTick]=useState(0);
  const [sel,setSel]=useState(null);
  const [motivo,setMotivo]=useState("");
  const pend=[];
  ALL_STORES.forEach(s=>LS.get(s).filter(i=>i.anulacion&&i.anulacion.estado==="pendiente").forEach(i=>pend.push({store:s,item:i})));

  const resolver=(aprobar)=>{
    if(!motivo.trim()) return alert("Justificá tu decisión");
    resolveAnul(sel.store,sel.item.id,user,aprobar,motivo);
    setSel(null); setMotivo(""); setTick(t=>t+1);
  };

  if(sel){
    const {store,item}=sel;
    return (
      <div>
        <button style={css.back} onClick={()=>{setSel(null);setMotivo("");}}>← Volver</button>
        <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:4}}>Resolver anulación</div>
        <div style={{color:B.muted,fontSize:12,marginBottom:16}}>{STORE_LABEL[store]}</div>
        <div style={{...css.card,padding:"12px 14px",marginBottom:14}}>
          <div style={{color:B.text,fontWeight:700}}>{itemTitle(store,item)}</div>
          <div style={{color:B.muted,fontSize:12,marginTop:2}}>{itemSub(store,item)}</div>
          <div style={{color:B.subtle,fontSize:11,marginTop:2}}>Cargado por {item.operario}</div>
        </div>
        <div style={{...css.card,padding:"12px 14px",marginBottom:14,borderColor:`${B.yellow}40`}}>
          <div style={{color:B.yellow,fontWeight:700,fontSize:13}}>Solicitud de {item.anulacion.solicitante}</div>
          <div style={{color:B.muted,fontSize:11,marginTop:2}}>{fmt(item.anulacion.solicitud_ts)}</div>
          <div style={{color:B.text,fontSize:13,marginTop:6}}>Motivo: {item.anulacion.motivo_solicitud}</div>
        </div>
        <Field label="Tu justificación *"><textarea style={{...css.input,resize:"vertical"}} rows={3} value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="Por qué aprobás o rechazás..."/></Field>
        <div style={{display:"flex",gap:8}}>
          <button style={{...css.btn,flex:1,background:B.red,color:"#fff"}} onClick={()=>resolver(true)}>✓ Aprobar anulación</button>
          <button style={{...css.btn,flex:1,background:B.card,color:B.text,border:`1px solid ${B.border}`}} onClick={()=>resolver(false)}>✗ Rechazar</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:6}}>✋ Anulaciones pendientes</div>
      <div style={{color:B.muted,fontSize:12,marginBottom:20}}>Solicitudes de operarios que requieren tu aprobación</div>
      {pend.length===0&&<div style={{color:B.muted,textAlign:"center",padding:40}}>✅ No hay anulaciones pendientes.</div>}
      {pend.map(({store,item})=>(
        <div key={item.id} onClick={()=>setSel({store,item})} style={{...css.card,padding:"13px 14px",marginBottom:10,cursor:"pointer",borderColor:`${B.yellow}40`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div><div style={{color:B.text,fontWeight:700,fontSize:14}}>{itemTitle(store,item)}</div><div style={{color:B.muted,fontSize:11,marginTop:2}}>{STORE_LABEL[store]} · {itemSub(store,item)}</div></div>
            <Badge color={B.yellow} bg="#3D2C00" label="Pendiente"/>
          </div>
          <div style={{color:B.subtle,fontSize:11,marginTop:6}}>Solicitó {item.anulacion.solicitante} · {item.anulacion.motivo_solicitud.slice(0,40)}{item.anulacion.motivo_solicitud.length>40?"…":""}</div>
        </div>
      ))}
    </div>
  );
}

/* CONFIGURACIÓN (solo admin) */
function Configuracion(){
  const [cat,setCat]=useState(()=>getCat());
  const SECCIONES=[
    {key:"mp_materiales",label:"Materiales (MP)",emoji:"📦"},
    {key:"mp_proveedores",label:"Proveedores",emoji:"🏭"},
    {key:"mp_unidades",label:"Unidades MP",emoji:"⚖️"},
    {key:"rellenos",label:"Tipos de Relleno",emoji:"🥩"},
    {key:"masas",label:"Tipos de Masa",emoji:"🥖"},
    {key:"semi",label:"Tipos de Semielaborado",emoji:"🥟"},
    {key:"pt",label:"Tipos de Producto Terminado",emoji:"✅"},
    {key:"insumos_limpieza",label:"Insumos de Limpieza",emoji:"🧴"},
  ];
  const [openKey,setOpenKey]=useState(null);
  const [nuevo,setNuevo]=useState("");
  const [editIdx,setEditIdx]=useState(null);
  const [editVal,setEditVal]=useState("");

  const persist=c=>{ LS.set("catalogos",c); setCat({...c}); pushCatalogos(c); };
  const add=key=>{ if(!nuevo.trim())return; const c={...cat,[key]:[...cat[key],nuevo.trim()]}; persist(c); setNuevo(""); };
  const rename=(key,idx)=>{ if(!editVal.trim())return; const arr=[...cat[key]]; arr[idx]=editVal.trim(); persist({...cat,[key]:arr}); setEditIdx(null); setEditVal(""); };
  // Cuenta cuántos registros usan un valor del catálogo (para avisar antes de borrar)
  const usos=(key,valor)=>{
    const map={mp_materiales:["mp","material"],mp_proveedores:["mp","proveedor"],rellenos:["rellenos","tipo"],masas:["masas","tipo"],semi:["semi","tipo"],pt:["pt","tipo"],insumos_limpieza:["insumos_limpieza","insumo"]};
    const m=map[key]; if(!m) return 0;
    return LS.get(m[0]).filter(i=>i.estado!=="anulado"&&i[m[1]]===valor).length;
  };
  const del=(key,idx)=>{
    const valor=cat[key][idx];
    const n=usos(key,valor);
    const msg=n>0
      ? `"${valor}" tiene ${n} registro(s) cargado(s). Si lo eliminás del catálogo, esos registros se conservan pero ya no podrás cargar nuevos con este valor. ¿Eliminar igual?`
      : "¿Eliminar este ítem del catálogo?";
    if(!window.confirm(msg))return;
    persist({...cat,[key]:cat[key].filter((_,i)=>i!==idx)});
  };

  if(openKey){
    const sec=SECCIONES.find(s=>s.key===openKey);
    return (
      <div>
        <button style={css.back} onClick={()=>{setOpenKey(null);setNuevo("");setEditIdx(null);}}>← Volver a Configuración</button>
        <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:16}}>{sec.emoji} {sec.label}</div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <input style={{...css.input,flex:1}} value={nuevo} onChange={e=>setNuevo(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add(openKey)} placeholder="Nuevo ítem..."/>
          <button style={{...css.btn,width:"auto",padding:"0 16px"}} onClick={()=>add(openKey)}>+ Agregar</button>
        </div>
        {cat[openKey].length===0&&<div style={{color:B.muted,textAlign:"center",padding:20}}>Catálogo vacío. Agregá el primer ítem.</div>}
        {cat[openKey].map((item,idx)=>(
          <div key={idx} style={{...css.card,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
            {editIdx===idx?(
              <>
                <input style={{...css.input,flex:1}} value={editVal} onChange={e=>setEditVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&rename(openKey,idx)}/>
                <button style={{...css.btnSm,color:B.accent,borderColor:B.accent+"40"}} onClick={()=>rename(openKey,idx)}>✓</button>
                <button style={css.btnSm} onClick={()=>{setEditIdx(null);setEditVal("");}}>✗</button>
              </>
            ):(
              <>
                <span style={{flex:1,color:B.text,fontSize:14}}>{item}</span>
                <button style={css.btnSm} onClick={()=>{setEditIdx(idx);setEditVal(item);}}>✏️</button>
                <button style={css.btnDanger} onClick={()=>del(openKey,idx)}>🗑</button>
              </>
            )}
          </div>
        ))}
      </div>
    );
  }

  return (
    <div>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:6}}>⚙️ Configuración</div>
      <div style={{color:B.muted,fontSize:12,marginBottom:20}}>Catálogos predeterminados. Los operarios cargan eligiendo de estas listas.</div>
      {SECCIONES.map(s=>(
        <div key={s.key} onClick={()=>{setOpenKey(s.key);setNuevo("");}} style={{...css.card,padding:"14px 16px",marginBottom:8,cursor:"pointer",display:"flex",alignItems:"center",gap:14}}>
          <span style={{fontSize:22}}>{s.emoji}</span>
          <div style={{flex:1}}><div style={{color:B.text,fontWeight:700,fontSize:14}}>{s.label}</div><div style={{color:B.muted,fontSize:12,marginTop:1}}>{cat[s.key]?.length||0} ítems</div></div>
          <span style={{color:B.subtle,fontSize:20}}>›</span>
        </div>
      ))}
    </div>
  );
}

/* USUARIOS (solo admin) */
function Usuarios({currentUser}){
  const [users,setUsers]=useState(()=>LS.get("users"));
  const [view,setView]=useState("list");
  const emptyPerm=()=>Object.fromEntries([...PERM_CARGA,...PERM_FUNC].map(p=>[p.k,false]));
  const F0={usr:"",pw:"",nombre:"",permisos:emptyPerm()};
  const [form,setForm]=useState(F0);
  const [editId,setEditId]=useState(null);
  const [err,setErr]=useState("");
  const uf=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const togP=k=>setForm(p=>({...p,permisos:{...p.permisos,[k]:!p.permisos[k]}}));

  const save=()=>{
    if(!form.usr||!form.nombre||(!editId&&!form.pw)) return setErr("Completá nombre, usuario y contraseña");
    if(!editId&&users.find(u=>u.usr===form.usr)) return setErr("Ese usuario ya existe");
    let upd;
    if(editId) upd=users.map(u=>u.id===editId?{...u,nombre:form.nombre,permisos:form.permisos,pw:form.pw||u.pw}:u);
    else upd=[...users,{id:uid(),usr:form.usr,pw:form.pw,nombre:form.nombre,esAdmin:false,permisos:form.permisos}];
    LS.set("users",upd); setUsers(upd);
    const saved = editId ? upd.find(u=>u.id===editId) : upd[upd.length-1];
    if(saved) pushUser(saved);
    setForm(F0); setEditId(null); setErr(""); setView("list");
  };
  const del=id=>{ if(id===currentUser.id)return alert("No podés eliminar tu propio usuario"); if(!window.confirm("¿Eliminar usuario?"))return; const upd=users.filter(u=>u.id!==id); LS.set("users",upd); setUsers(upd); syncOp({fn:"deluser",id}); };
  const startEdit=u=>{ setForm({usr:u.usr,pw:"",nombre:u.nombre,permisos:{...emptyPerm(),...u.permisos}}); setEditId(u.id); setErr(""); setView("form"); };

  if(view==="form") return (
    <div>
      <button style={css.back} onClick={()=>{setView("list");setEditId(null);setForm(F0);setErr("");}}>← Volver</button>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:20}}>{editId?"Editar usuario":"Nuevo usuario"}</div>
      <Field label="Nombre completo *"><input style={css.input} value={form.nombre} onChange={uf("nombre")} placeholder="Ej: María González"/></Field>
      <Field label="Usuario (login) *"><input style={{...css.input,opacity:editId?0.6:1}} value={form.usr} onChange={uf("usr")} placeholder="mgonzalez" disabled={!!editId}/></Field>
      <Field label={editId?"Nueva contraseña (vacío = no cambiar)":"Contraseña *"}><input style={css.input} type="password" value={form.pw} onChange={uf("pw")} placeholder="contraseña"/></Field>
      <div style={css.sec}>Permisos de carga</div>
      {PERM_CARGA.map(p=><PermCheck key={p.k} label={p.label} checked={!!form.permisos[p.k]} onToggle={()=>togP(p.k)}/>)}
      <div style={{...css.sec,marginTop:14}}>Permisos de función</div>
      {PERM_FUNC.map(p=><PermCheck key={p.k} label={p.label} checked={!!form.permisos[p.k]} onToggle={()=>togP(p.k)}/>)}
      <div style={{color:B.muted,fontSize:11,marginTop:8,marginBottom:14,padding:"8px 12px",background:B.surface,borderRadius:8}}>ℹ️ La configuración de catálogos y la gestión de usuarios son exclusivas del administrador y no se pueden delegar.</div>
      {err&&<div style={{color:B.red,fontSize:12,marginBottom:12}}>{err}</div>}
      <button style={css.btn} onClick={save}>{editId?"Guardar cambios":"Crear usuario"}</button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{color:B.text,fontSize:18,fontWeight:800}}>👥 Usuarios</div>
        <button style={{...css.btnSm,color:B.accent,borderColor:B.accent+"40"}} onClick={()=>{setForm(F0);setEditId(null);setView("form");}}>+ Nuevo</button>
      </div>
      {users.map(u=>{
        const activos=[...PERM_CARGA,...PERM_FUNC].filter(p=>u.permisos&&u.permisos[p.k]).length;
        return (
          <div key={u.id} style={{...css.card,padding:"13px 14px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div><div style={{color:B.text,fontWeight:700,fontSize:14}}>{u.nombre}{u.id===currentUser.id&&<span style={{color:B.muted,fontSize:11}}> (vos)</span>}</div><div style={{color:B.muted,fontSize:12,marginTop:2}}>@{u.usr}</div></div>
              {u.esAdmin?<Badge color={B.yellow} bg="#3D2C00" label="Administrador"/>:<Badge color={B.accent} bg={B.accentD} label={`${activos} permisos`}/>}
            </div>
            {!u.esAdmin&&(
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <button style={{...css.btnSm,color:B.accent,borderColor:B.accent+"40"}} onClick={()=>startEdit(u)}>✏️ Editar</button>
                {u.id!==currentUser.id&&<button style={css.btnDanger} onClick={()=>del(u.id)}>🗑 Eliminar</button>}
              </div>
            )}
            {u.esAdmin&&<div style={{color:B.muted,fontSize:11,marginTop:8}}>Acceso total + configuración de catálogos. No editable.</div>}
          </div>
        );
      })}
    </div>
  );
}

/* TRAZABILIDAD */
function Trazabilidad(){
  const [q,setQ]=useState("");
  const [sel,setSel]=useState(null); // {store,item}

  // Buscador universal: por nombre, lote o remito, en todas las etapas
  const resultados=()=>{
    const t=q.toLowerCase().trim();
    if(!t) return [];
    const out=[];
    STORES_ORDER.forEach(store=>{
      LS.get(store).forEach(i=>{
        const hay=`${itemName(store,i)} ${i.lote||""} ${i.remito||""}`.toLowerCase();
        if(hay.includes(t)) out.push({store,item:i});
      });
    });
    return out.sort((a,b)=>itemTs(b.item)<itemTs(a.item)?-1:1).slice(0,40);
  };

  // ---- Vista de cadena bidireccional de un ítem ----
  if(sel){
    const {store,item}=sel;
    const meta=STORE_META[store];
    const back=backwardChain(store,item);   // {semi,rellenos,masas,mp}
    const fwd=forwardChain(store,item);     // {rellenos,masas,semi,pt}

    // mapa de consumo (cuánto se usó de cada ítem), recorriendo todos los que tienen consumo
    const consMap={};
    [...LS.get("rellenos"),...LS.get("masas"),...LS.get("semi"),...LS.get("pt")].forEach(p=>{
      if(p.consumo) Object.entries(p.consumo).forEach(([id,c])=>{ consMap[id]=(consMap[id]||0)+(c.cantidad||0); });
    });
    const usado=i=>consMap[i.id]?` · usado ${consMap[i.id]}${i.unidad||""}`:"";

    const Item=({store,i,dim})=>(
      <div style={{...css.card,padding:"10px 12px",marginBottom:6,borderColor:`${STORE_META[store].color}40`,opacity:i.estado==="anulado"?0.45:1}}>
        {i.estado==="anulado"&&<div style={{color:B.red,fontSize:11,marginBottom:3}}>⛔ Anulado</div>}
        <div style={{color:B.text,fontSize:13,fontWeight:700}}>{STORE_META[store].emoji} {itemName(store,i)}</div>
        <div style={{color:B.muted,fontSize:11,marginTop:2}}>
          {store==="mp"?`${i.proveedor} · `:""}Lote {i.lote||"—"}{i.remito?` · Rem ${i.remito}`:""} · {store==="mp"?`${i.cantidad}${i.unidad}`:qtyTxt(i)}{dim?usado(i):""}
        </div>
        <div style={{color:B.subtle,fontSize:11,marginTop:2}}>👤 {i.operario} · {fmt(itemTs(i))}</div>
      </div>
    );
    const Section=({title,arrow,stores,data,dim})=>{
      const has=stores.some(s=>(data[s]||[]).length);
      if(!has) return null;
      return (
        <div style={{marginBottom:10}}>
          <div style={{color:B.subtle,fontSize:11,margin:"2px 0 8px 4px"}}>{arrow} {title}</div>
          {stores.map(s=>(data[s]||[]).map(i=><Item key={s+i.id} store={s} i={i} dim={dim}/>))}
        </div>
      );
    };

    const generarPDF=()=>{
      const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
      const fila=cols=>`<tr>${cols.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`;
      const rowsOf=(arr,store)=>arr.map(i=>fila([
        STORE_META[store].label, itemName(store,i), i.lote||"—", i.remito||"—",
        store==="mp"?`${i.cantidad??"—"} ${i.unidad||""}`:qtyTxt(i),
        consMap[i.id]?`${consMap[i.id]} ${i.unidad||""}`:"—",
        i.fecha_vto||"—", fmt(itemTs(i)), i.operario||"—", i.estado||"—"
      ])).join("");
      const tabla=(titulo,rows)=>rows?`<h3>${titulo}</h3><table><thead><tr><th>Etapa</th><th>Nombre</th><th>Lote</th><th>Remito</th><th>Producido</th><th>Usado</th><th>Vto</th><th>Fecha</th><th>Responsable</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>`:"";
      const secBack=[
        rowsOf(back.semi||[],"semi"),rowsOf(back.rellenos||[],"rellenos"),
        rowsOf(back.masas||[],"masas"),rowsOf(back.mp||[],"mp")
      ].join("");
      const secFwd=[
        rowsOf(fwd.rellenos||[],"rellenos"),rowsOf(fwd.masas||[],"masas"),
        rowsOf(fwd.semi||[],"semi"),rowsOf(fwd.pt||[],"pt")
      ].join("");
      const hoy=new Date().toLocaleString("es-AR");
      const html=`<!doctype html><html><head><meta charset="utf-8"><title>Trazabilidad ${esc(item.lote)}</title>
        <style>
          *{font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}
          body{margin:0;padding:32px;color:#1a1a1a;font-size:12px}
          .hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #A8C820;padding-bottom:14px;margin-bottom:18px}
          .hdr h1{margin:0;font-size:20px;color:#3a5a18}
          .hdr .sub{color:#666;font-size:11px;margin-top:3px}
          .empresa{text-align:right;font-size:11px;color:#444}
          .resumen{background:#f4f7e8;border:1px solid #d4e08a;border-radius:6px;padding:12px 14px;margin-bottom:18px}
          .resumen b{color:#3a5a18}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:6px}
          h3{color:#3a5a18;font-size:13px;margin:16px 0 6px;border-left:4px solid #A8C820;padding-left:8px}
          table{width:100%;border-collapse:collapse;margin-bottom:8px}
          th{background:#3a5a18;color:#fff;font-size:9.5px;text-align:left;padding:5px 6px}
          td{border:1px solid #ddd;padding:4px 6px;font-size:9.5px}
          tr:nth-child(even) td{background:#fafaf4}
          .foot{margin-top:24px;border-top:1px solid #ccc;padding-top:12px;color:#888;font-size:10px;display:flex;justify-content:space-between}
          .firma{margin-top:36px;display:flex;gap:60px}
          .firma div{flex:1;border-top:1px solid #333;padding-top:5px;font-size:10px;text-align:center;color:#555}
          @media print{body{padding:16px}}
        </style></head><body>
        <div class="hdr">
          <div><h1>Reporte de Trazabilidad</h1><div class="sub">Cadena bidireccional · ${esc(meta.label)}</div></div>
          <div class="empresa"><b>Chefexprés</b><br>Godoy Cruz, Mendoza<br>Emitido: ${esc(hoy)}</div>
        </div>
        <div class="resumen">
          <div style="font-size:14px;margin-bottom:6px"><b>${esc(meta.label)}:</b> ${esc(itemName(store,item))} &nbsp;·&nbsp; <b>Lote:</b> ${esc(item.lote||"—")}</div>
          <div class="grid">
            ${store==="mp"?`<div><b>Proveedor:</b> ${esc(item.proveedor||"—")}</div><div><b>Remito:</b> ${esc(item.remito||"—")}</div>`:""}
            <div><b>Cantidad:</b> ${esc(store==="mp"?`${item.cantidad} ${item.unidad}`:qtyTxt(item))}</div>
            <div><b>Vencimiento:</b> ${esc(item.fecha_vto||"—")}</div>
            <div><b>Estado:</b> ${esc(item.estado||"—")}</div>
            <div><b>Responsable:</b> ${esc(item.operario||"—")}</div>
            <div><b>Fecha:</b> ${esc(fmt(itemTs(item)))}</div>
          </div>
        </div>
        ${secBack?`<h2 style="color:#3a5a18;font-size:15px;margin:14px 0 4px">↑ Hacia atrás (origen)</h2>${tabla("Insumos que lo componen",secBack)}`:""}
        ${secFwd?`<h2 style="color:#3a5a18;font-size:15px;margin:18px 0 4px">↓ Hacia adelante (destino)</h2>${tabla("Productos donde se utilizó",secFwd)}`:""}
        ${!secBack&&!secFwd?`<p style="color:#666">Este ítem no tiene cadena registrada (ni origen ni destino).</p>`:""}
        <div class="firma"><div>Firma responsable de planta</div><div>Firma auditor / inspector</div></div>
        <div class="foot"><span>Generado por sistema de trazabilidad Chefexprés</span><span>Lote ${esc(item.lote||"—")} · ${esc(hoy)}</span></div>
        <script>window.onload=function(){window.print();}<\/script>
      </body></html>`;
      const w=window.open("","_blank");
      if(!w){ alert("Permití las ventanas emergentes para generar el PDF."); return; }
      w.document.write(html); w.document.close();
    };

    const hayBack=["semi","rellenos","masas","mp"].some(s=>(back[s]||[]).length);
    const hayFwd=["rellenos","masas","semi","pt"].some(s=>(fwd[s]||[]).length);

    return (
      <div>
        <button style={css.back} onClick={()=>setSel(null)}>← Volver al buscador</button>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:14}}>
          <div><div style={{color:B.text,fontSize:16,fontWeight:800,marginBottom:2}}>Trazabilidad de {meta.label.toLowerCase()}</div><div style={{color:B.muted,fontSize:12}}>{itemName(store,item)} · Lote {item.lote||"—"}</div></div>
          <button onClick={generarPDF} style={{...css.btn,width:"auto",padding:"9px 14px",fontSize:13,flexShrink:0}}>📄 Reporte PDF</button>
        </div>

        {/* HACIA ATRÁS */}
        {hayBack&&<div style={{color:B.accent,fontSize:13,fontWeight:800,margin:"4px 0 10px"}}>↑ Hacia atrás — de dónde viene</div>}
        <Section title="Semielaborados" arrow="•" stores={["semi"]} data={back} dim/>
        <Section title="Rellenos y masas" arrow="•" stores={["rellenos","masas"]} data={back} dim/>
        <Section title="Materias primas (origen)" arrow="•" stores={["mp"]} data={back} dim/>

        {/* ÍTEM CENTRAL */}
        <div style={{margin:"10px 0",padding:"4px 0"}}>
          <div style={{color:B.subtle,fontSize:11,margin:"0 0 6px 4px"}}>◆ ítem trazado</div>
          <div style={{...css.card,padding:"12px 14px",borderColor:meta.color,borderWidth:2,background:`${meta.color}12`}}>
            <div style={{color:B.text,fontSize:14,fontWeight:800}}>{meta.emoji} {itemName(store,item)}</div>
            <div style={{color:B.muted,fontSize:12,marginTop:3}}>{store==="mp"?`${item.proveedor} · `:""}Lote {item.lote||"—"}{item.remito?` · Remito ${item.remito}`:""} · {store==="mp"?`${item.cantidad}${item.unidad}`:qtyTxt(item)}{item.fecha_vto?` · Vto ${item.fecha_vto}`:""}</div>
            <div style={{color:B.subtle,fontSize:11,marginTop:3}}>👤 {item.operario} · {fmt(itemTs(item))} · {statusBadge(item.estado)}</div>
          </div>
        </div>

        {/* HACIA ADELANTE */}
        {hayFwd&&<div style={{color:B.yellow,fontSize:13,fontWeight:800,margin:"14px 0 10px"}}>↓ Hacia adelante — a dónde fue</div>}
        <Section title="Rellenos y masas" arrow="•" stores={["rellenos","masas"]} data={fwd}/>
        <Section title="Semielaborados" arrow="•" stores={["semi"]} data={fwd}/>
        <Section title="Productos terminados" arrow="•" stores={["pt"]} data={fwd}/>
        {/* Gancho módulo ventas: cuando exista distribución, acá se mostrará el destino de venta */}
        {hayFwd&&(fwd.pt||[]).length>0&&<div style={{...css.card,padding:"10px 12px",marginTop:4,borderColor:B.border,opacity:0.55}}><div style={{color:B.muted,fontSize:12}}>🚚 Distribución / Venta</div><div style={{color:B.subtle,fontSize:11,marginTop:2}}>Módulo de ventas no activo. Al activarlo, la cadena llegará hasta el cliente.</div></div>}

        {!hayBack&&!hayFwd&&<div style={{color:B.muted,textAlign:"center",padding:30}}>Este ítem no tiene cadena registrada todavía.</div>}
      </div>
    );
  }

  // ---- Buscador ----
  const res=resultados();
  return (
    <div>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:4}}>🔗 Trazabilidad</div>
      <div style={{color:B.muted,fontSize:12,marginBottom:16}}>Buscá cualquier ítem por nombre, lote o remito y vé su cadena hacia atrás y hacia adelante.</div>
      <input value={q} onChange={e=>setQ(e.target.value)} autoFocus placeholder="🔍 Ej: calabaza, SEM-20260613-01, remito 1234..." style={{...css.input,marginBottom:16}}/>
      {!q.trim()&&<div style={{color:B.subtle,fontSize:12,textAlign:"center",padding:30}}>Escribí algo para empezar a buscar.<br/>Podés trazar materias primas, rellenos, masas, semielaborados o productos terminados.</div>}
      {q.trim()&&res.length===0&&<div style={{color:B.muted,textAlign:"center",padding:30}}>Sin resultados para "{q}".</div>}
      {res.map(({store,item})=>(
        <div key={store+item.id} onClick={()=>setSel({store,item})} style={{...css.card,padding:"12px 14px",marginBottom:8,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",borderColor:`${STORE_META[store].color}30`}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:B.text,fontWeight:700,fontSize:13}}>{STORE_META[store].emoji} {itemName(store,item)}</div>
            <div style={{color:B.muted,fontSize:11,marginTop:2}}>{STORE_META[store].label} · Lote {item.lote||"—"}{item.remito?` · Rem ${item.remito}`:""}</div>
            <div style={{color:B.subtle,fontSize:11,marginTop:1}}>{fmt(itemTs(item))} · por {item.operario}</div>
          </div>
          <div style={{color:B.subtle,marginLeft:8}}>›</div>
        </div>
      ))}
    </div>
  );
}

/* EFICIENCIA */
function Eficiencia(){
  const pts=LS.get("pt").filter(l=>l.timestamp_fin);
  if(!pts.length) return <div><div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:20}}>📊 Eficiencia</div><div style={{color:B.muted,textAlign:"center",padding:40}}>Completá al menos una orden de PT para ver métricas.</div></div>;
  const durs=pts.map(l=>diffM(l.timestamp_inicio,l.timestamp_fin));
  const chain=pts.map(pt=>{ const {mp}=getChain(pt); const o=mp.reduce((a,m)=>!a||m.timestamp<a?m.timestamp:a,null); return o&&pt.timestamp_fin?diffM(o,pt.timestamp_fin):null; });
  const prom=Math.round(durs.reduce((a,b)=>a+b,0)/durs.length);
  const pctLib=Math.round(pts.filter(l=>l.estado==="liberado").length/pts.length*100);
  const f2=m=>m===null?"—":m<60?`${m}m`:`${Math.floor(m/60)}h ${m%60}m`;
  const maxD=Math.max(...durs);
  return (
    <div>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:20}}>📊 Eficiencia</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:20}}>
        {[["Completados",pts.length,B.text],["T. prom elab.",f2(prom),B.accent],["Más rápido",f2(Math.min(...durs)),B.green],["Más lento",f2(maxD),B.yellow],["Tasa lib.",`${pctLib}%`,B.green],["Cuarentena",pts.filter(l=>l.estado==="cuarentena").length,B.red]].map(([l,v,c])=>(
          <div key={l} style={{...css.card,padding:"13px 14px",flex:1,minWidth:100}}><div style={{color:B.muted,fontSize:10,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>{l}</div><div style={{color:c,fontSize:20,fontWeight:800}}>{v}</div></div>
        ))}
      </div>
      <div style={{color:B.text,fontWeight:700,marginBottom:12}}>Duración por lote PT</div>
      {pts.map((l,i)=>(
        <div key={l.id} style={{...css.card,padding:"11px 13px",marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <div style={{color:B.text,fontSize:13,fontWeight:700}}>{l.tipo}</div>
            <div style={{textAlign:"right"}}><span style={{color:B.accent,fontWeight:700,fontSize:13}}>{f2(durs[i])}</span>{chain[i]&&<div style={{color:B.muted,fontSize:10}}>cadena total: {f2(chain[i])}</div>}</div>
          </div>
          <div style={{background:B.surface,borderRadius:4,height:5,overflow:"hidden"}}><div style={{background:durs[i]>prom?B.yellow:B.accent,height:"100%",width:`${(durs[i]/maxD)*100}%`,borderRadius:4}}/></div>
          <div style={{color:B.muted,fontSize:10,marginTop:4}}>{fmt(l.timestamp_inicio)} → {fmt(l.timestamp_fin)} · {l.operario}</div>
        </div>
      ))}
    </div>
  );
}

/* EXPORTAR */
function Exportar(){
  const [estado,setEstado]=useState("idle"); // idle | sync | error
  const [ultimo,setUltimo]=useState(()=>LS.get("_lastsync",null));
  const [,setTick]=useState(0);

  // Trae lo más reciente de Supabase a la caché (todos los usuarios) y refresca la vista.
  // Devuelve true si la nube respondió OK (o si no hay nube configurada → backup local).
  const sincronizar=async()=>{
    if(!SUPA_READY) return true;
    setEstado("sync");
    await obFlush();           // primero subir lo pendiente, después bajar
    const ok=await pullAll();
    setUltimo(LS.get("_lastsync",null));
    setEstado(ok?"idle":"error");
    setTick(t=>t+1);
    return ok;
  };
  // Al entrar al módulo, bajar datos frescos para que los conteos y la exportación sean los reales.
  useEffect(()=>{ sincronizar(); },[]);

  const dl=(content,filename,type)=>{ const b=new Blob([content],{type}); const url=URL.createObjectURL(b); const a=document.createElement("a"); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); };
  // Garantiza datos frescos de la nube antes de generar cualquier archivo.
  const exportar=async(fn)=>{ const ok=await sincronizar(); if(!ok&&!window.confirm("No se pudo traer lo último de la nube. ¿Exportar igual con los datos en caché?")) return; fn(); };

  // Nota: los usuarios se exportan SIN contraseña (el backup circula por mail/WhatsApp)
  const exportJSON=()=>{ const data={exportado:now(),empresa:"Chefexprés",entorno:ENV,version:"4.1",datos:{mp:LS.get("mp"),rellenos:LS.get("rellenos"),masas:LS.get("masas"),semi:LS.get("semi"),pt:LS.get("pt"),registros_limpieza:LS.get("registros_limpieza"),insumos_limpieza:LS.get("insumos_limpieza"),usuarios:LS.get("users").map(({pw,...u})=>u),catalogos:LS.get("catalogos")}}; dl(JSON.stringify(data,null,2),`chefexpres-backup-${now().slice(0,10)}.json`,"application/json"); };
  // Escapa comillas y neutraliza inyección de fórmulas (=, +, -, @ al inicio ejecutan en Excel)
  const q=v=>{ let s=(v??"").toString(); if(/^[=+\-@]/.test(s)) s="'"+s; return `"${s.replace(/"/g,'""')}"`; };
  const CSVS=[
    {label:"Ingreso MP",emoji:"📦",store:"mp",headers:["ID","Fecha ingreso","Proveedor","Material","Lote","Remito","Cant","Unidad","Vencimiento","Cargado por","Estado","Retrasada","Demora min"],row:i=>[i.id,i.timestamp?.slice(0,16),i.proveedor,i.material,i.lote,i.remito||"",i.cantidad,i.unidad,i.fecha_vto||"",i.operario,i.estado,i.retrasada?"Sí":"No",i.demora_min||0].map(q).join(";")},
    {label:"Rellenos",emoji:"🥩",store:"rellenos",headers:["ID","Tipo","Lote","Inicio","Fin","Cant","Unidad","Vencimiento","Cargado por","Estado"],row:i=>[i.id,i.tipo,i.lote,i.timestamp_inicio?.slice(0,16),i.timestamp_fin?.slice(0,16)||"",i.cantidad,i.unidad,i.fecha_vto||"",i.operario,i.estado].map(q).join(";")},
    {label:"Masas",emoji:"🥖",store:"masas",headers:["ID","Tipo","Lote","Inicio","Fin","Cant","Unidad","Vencimiento","Cargado por","Estado"],row:i=>[i.id,i.tipo,i.lote,i.timestamp_inicio?.slice(0,16),i.timestamp_fin?.slice(0,16)||"",i.cantidad,i.unidad,i.fecha_vto||"",i.operario,i.estado].map(q).join(";")},
    {label:"Semielaborados",emoji:"🥟",store:"semi",headers:["ID","Tipo","Lote","Inicio","Fin","Cant","Unidad","Vencimiento","Cargado por","Estado"],row:i=>[i.id,i.tipo,i.lote,i.timestamp_inicio?.slice(0,16),i.timestamp_fin?.slice(0,16)||"",i.cantidad,i.unidad,i.fecha_vto||"",i.operario,i.estado].map(q).join(";")},
    {label:"Producto Terminado",emoji:"✅",store:"pt",headers:["ID","Tipo","Lote PT","Inicio","Fin","Cant","Unidad","Vencimiento","Cargado por","Estado"],row:i=>[i.id,i.tipo,i.lote,i.timestamp_inicio?.slice(0,16),i.timestamp_fin?.slice(0,16)||"",i.cantidad,i.unidad,i.fecha_vto||"",i.operario,i.estado].map(q).join(";")},
    {label:"Registro de limpiezas",emoji:"🧼",store:"registros_limpieza",headers:["ID","Fecha","Zona","POES","Ítems OK","Observaciones","Operario"],row:i=>[i.id,i.ts_registro?.slice(0,16),i.zona_nombre,i.poes||"",(i.items_ok||[]).join(" | "),i.observaciones||"",i.operario].map(q).join(";")},
    {label:"Insumos de limpieza",emoji:"🧴",store:"insumos_limpieza",headers:["ID","Fecha","Insumo","Proveedor","Lote","Remito","Cant","Unidad","Vencimiento","Apto alim.","N° cert.","Operario"],row:i=>[i.id,i.ts_ingreso?.slice(0,16),i.insumo,i.proveedor,i.lote,i.remito||"",i.cantidad,i.unidad,i.fecha_vto||"",i.apto_alimenticio?"Sí":"No",i.nro_certificado||"",i.operario].map(q).join(";")},
  ];
  // BOM (\uFEFF) para que Excel reconozca UTF-8 (tildes/ñ) y separador ";" (locale es-AR)
  const expCSV=c=>{ const rows=[c.headers.join(";"),...LS.get(c.store).map(c.row)]; dl("\uFEFF"+rows.join("\n"),`${c.store}-${now().slice(0,10)}.csv`,"text/csv;charset=utf-8"); };

  const sincronizando=estado==="sync";
  return (
    <div>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:6}}>📤 Exportar datos</div>
      <div style={{color:B.muted,fontSize:12,marginBottom:14}}>{SUPA_READY?"Trae lo más reciente de la nube (todos los usuarios) y lo exporta. Ideal para respaldo y auditoría.":"⚠️ Sin conexión a la nube: exporta solo los datos de este dispositivo."}</div>
      {SUPA_READY&&(
        <div style={{...css.card,padding:"10px 13px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",borderColor:estado==="error"?`${B.red}50`:B.border}}>
          <div style={{fontSize:12}}>
            {sincronizando&&<span style={{color:B.accent}}>🔄 Sincronizando con la nube…</span>}
            {!sincronizando&&estado==="error"&&<span style={{color:B.red}}>⚠️ No se pudo sincronizar. Reintentá.</span>}
            {!sincronizando&&estado!=="error"&&<span style={{color:B.muted}}>☁️ Datos al día{ultimo?` · ${fmt(ultimo)}`:""}</span>}
          </div>
          <button disabled={sincronizando} style={{...css.btnSm,color:B.accent,borderColor:B.accent+"40",opacity:sincronizando?0.5:1}} onClick={sincronizar}>Actualizar ↻</button>
        </div>
      )}
      <div style={{...css.card,padding:20,marginBottom:16,borderColor:`${B.accent}40`}}>
        <div style={{fontSize:24,marginBottom:8}}>🗂️</div>
        <div style={{color:B.text,fontWeight:800,fontSize:16}}>Backup completo JSON</div>
        <div style={{color:B.muted,fontSize:13,marginTop:4}}>Todos los módulos + catálogos en un archivo. Hacelo antes de cada actualización.</div>
        <button disabled={sincronizando} style={{...css.btn,marginTop:14,opacity:sincronizando?0.6:1}} onClick={()=>exportar(exportJSON)}>{sincronizando?"Trayendo de la nube…":"Descargar backup"}</button>
      </div>
      <div style={{color:B.text,fontWeight:700,marginBottom:12}}>Exportar por módulo (CSV para Excel)</div>
      {CSVS.map(c=>(
        <div key={c.store} style={{...css.card,padding:"13px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><span style={{fontSize:18,marginRight:8}}>{c.emoji}</span><span style={{color:B.text,fontWeight:700}}>{c.label}</span><span style={{color:B.muted,fontSize:11,marginLeft:8}}>{LS.get(c.store).length} reg.</span></div>
          <button disabled={sincronizando} style={{...css.btnSm,color:B.accent,borderColor:B.accent+"40",opacity:sincronizando?0.5:1}} onClick={()=>exportar(()=>expCSV(c))}>CSV ↓</button>
        </div>
      ))}
    </div>
  );
}

/* CAPACITACIÓN */
/* Flag: la IA queda apagada en el MVP (feature opcional con costo). Cambiar a true para activarla. */
const IA_ENABLED = false;

function Capacitacion({user}){
  const [mode,setMode]=useState("menu");
  const [quiz,setQuiz]=useState([]); // preguntas del intento actual (aleatorias)
  const [qi,setQi]=useState(0),[selQ,setSelQ]=useState(null),[ans,setAns]=useState([]);
  const [saved,setSaved]=useState(false);
  const [msgs,setMsgs]=useState([{role:"assistant",text:"Hola 👋 Soy tu asistente de inocuidad alimentaria. ¿Qué necesitás?"}]);
  const [input,setInput]=useState(""),[loading,setLoading]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{ref.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  const startQuiz=()=>{ setQuiz(pickQuiz()); setQi(0); setAns([]); setSelQ(null); setSaved(false); setMode("quiz"); };
  const sig=()=>{ if(selQ===null)return; const na=[...ans,{qi,sel:selQ,ok:selQ===quiz[qi].ok}]; if(qi<quiz.length-1){setAns(na);setQi(qi+1);setSelQ(null);}else{setAns(na);setMode("result");} };

  // Guardar puntaje en el ranking (mejor intento por usuario)
  const guardarPuntaje=(pct,score,total)=>{
    const rk=LS.get("ranking");
    const idx=rk.findIndex(r=>r.userId===user.id);
    const entry={userId:user.id,nombre:user.nombre,mejorPct:pct,intentos:1,ultima:now()};
    if(idx>=0){
      const prev=rk[idx];
      rk[idx]={...prev,mejorPct:Math.max(prev.mejorPct,pct),intentos:(prev.intentos||0)+1,ultima:now(),nombre:user.nombre};
    } else rk.push(entry);
    LS.set("ranking",rk);
    const mine=rk.find(r=>r.userId===user.id);
    if(mine) pushRanking(mine);
    setSaved(true);
  };

  const sendAI=async()=>{ if(!input.trim()||loading)return; const q=input.trim();setInput("");setMsgs(p=>[...p,{role:"user",text:q}]);setLoading(true);
    try{ const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:"Sos especialista en inocuidad alimentaria y BPM para la industria argentina. Español rioplatense, claro y práctico. Conocés CAA, ANMAT, SENASA, HACCP. Empresa: Chefexprés, Godoy Cruz, Mendoza.",messages:msgs.slice(1).concat({role:"user",content:q}).map(m=>({role:m.role,content:m.text||m.content}))})}); const d=await r.json(); setMsgs(p=>[...p,{role:"assistant",text:d.content?.[0]?.text||"Sin respuesta."}]); }catch{setMsgs(p=>[...p,{role:"assistant",text:"Error de conexión."}]);} setLoading(false); };

  if(mode==="menu") return (
    <div>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:6}}>🎓 Capacitación</div>
      <div style={{color:B.muted,fontSize:12,marginBottom:24}}>Formación en inocuidad alimentaria y trazabilidad</div>
      <div style={{...css.card,padding:20,marginBottom:12,cursor:"pointer",borderColor:`${B.accent}50`}} onClick={startQuiz}><div style={{fontSize:28,marginBottom:8}}>📝</div><div style={{color:B.text,fontWeight:800,fontSize:16}}>Quiz BPM / HACCP</div><div style={{color:B.muted,fontSize:13,marginTop:4}}>{QUIZ_N} preguntas al azar de un banco de {QUIZ.length} · inocuidad, CAA, trazabilidad</div></div>
      <div style={{...css.card,padding:20,marginBottom:12,cursor:"pointer",borderColor:`${B.yellow}40`}} onClick={()=>setMode("ranking")}><div style={{fontSize:28,marginBottom:8}}>🏆</div><div style={{color:B.text,fontWeight:800,fontSize:16}}>Ranking del equipo</div><div style={{color:B.muted,fontSize:13,marginTop:4}}>Tabla de posiciones · mejor puntaje de cada uno</div></div>
      {IA_ENABLED&&<div style={{...css.card,padding:20,cursor:"pointer",borderColor:`${B.purple}40`}} onClick={()=>setMode("ai")}><div style={{fontSize:28,marginBottom:8}}>🤖</div><div style={{color:B.text,fontWeight:800,fontSize:16}}>Asistente de Inocuidad IA</div><div style={{color:B.muted,fontSize:13,marginTop:4}}>Consultá normativas, dudas de proceso, CAA</div></div>}
    </div>
  );

  if(mode==="quiz"){ const q=quiz[qi]; if(!q) return null; return (
    <div>
      <button style={css.back} onClick={()=>setMode("menu")}>← Salir</button>
      <div style={{color:B.muted,fontSize:12,marginBottom:4}}>Pregunta {qi+1}/{quiz.length}</div>
      <div style={{background:B.border,borderRadius:4,height:4,marginBottom:20}}><div style={{background:B.accent,height:4,borderRadius:4,width:`${((qi+1)/quiz.length)*100}%`}}/></div>
      <div style={{color:B.text,fontSize:15,fontWeight:700,marginBottom:20,lineHeight:1.5}}>{q.q}</div>
      {q.opts.map((opt,i)=>(<div key={i} onClick={()=>selQ===null&&setSelQ(i)} style={{...css.card,padding:"13px 14px",marginBottom:10,cursor:selQ===null?"pointer":"default",borderColor:selQ!==null?(i===q.ok?B.green:i===selQ?B.red:B.border):B.border,background:selQ!==null?(i===q.ok?"#1B3A1C":i===selQ?"#3D0E0E":B.card):B.card}}><div style={{color:selQ!==null?(i===q.ok?B.green:i===selQ?B.red:B.muted):B.text,fontSize:14}}>{selQ!==null&&i===q.ok&&"✓ "}{selQ!==null&&i===selQ&&i!==q.ok&&"✗ "}{opt}</div></div>))}
      {selQ!==null&&<><div style={{...css.card,padding:"12px 14px",marginBottom:16,borderColor:`${B.green}50`,background:"#1B3A1C"}}><div style={{color:B.green,fontSize:12,fontWeight:700,marginBottom:4}}>Explicación</div><div style={{color:B.text,fontSize:13,lineHeight:1.5}}>{q.exp}</div></div><button style={css.btn} onClick={sig}>{qi<quiz.length-1?"Siguiente →":"Ver resultados"}</button></>}
    </div>
  ); }

  if(mode==="result"){ const score=ans.filter(a=>a.ok).length,total=quiz.length,pct=Math.round(score/total*100); return (
    <div>
      <div style={{textAlign:"center",padding:"20px 0"}}><div style={{fontSize:56,marginBottom:8}}>{pct>=80?"🏆":pct>=60?"⭐":"📚"}</div><div style={{color:B.text,fontSize:24,fontWeight:800}}>{score}/{total}</div><div style={{color:B.accent,fontSize:36,fontWeight:800,marginTop:4}}>{pct}%</div><div style={{color:B.text,fontSize:15,marginTop:8}}>{pct>=80?"✅ Excelente":pct>=60?"👍 Bueno":pct>=40?"⚠️ Regular":"🔴 Necesita refuerzo"}</div><div style={{color:B.muted,fontSize:12,marginTop:4}}>{user.nombre}</div></div>
      {!saved
        ? <button style={{...css.btn,marginBottom:12}} onClick={()=>guardarPuntaje(pct,score,total)}>🏆 Guardar puntaje en el ranking</button>
        : <div style={{...css.card,padding:"12px 14px",marginBottom:12,borderColor:`${B.accent}50`,textAlign:"center",color:B.accent,fontWeight:700,fontSize:13}}>✓ Puntaje guardado. <span style={{color:B.muted,fontWeight:400}}>Se conserva tu mejor resultado.</span></div>}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button style={{...css.btn,flex:1,background:B.card,color:B.text,border:`1px solid ${B.border}`}} onClick={()=>setMode("ranking")}>Ver ranking</button>
        <button style={{...css.btn,flex:1}} onClick={startQuiz}>Reintentar</button>
      </div>
      {ans.map((a,i)=>(<div key={i} style={{...css.card,padding:"10px 13px",marginBottom:8,borderColor:a.ok?`${B.accent}40`:`${B.red}40`}}><div style={{color:a.ok?B.accent:B.red,fontSize:12,fontWeight:700,marginBottom:3}}>{a.ok?"✓":"✗"} Pregunta {i+1}</div><div style={{color:B.muted,fontSize:12}}>{quiz[a.qi].q.slice(0,65)}…</div>{!a.ok&&<div style={{color:B.text,fontSize:12,marginTop:4}}>Correcta: <b>{quiz[a.qi].opts[quiz[a.qi].ok]}</b></div>}</div>))}
      <button style={{...css.btn,marginTop:4,background:B.card,color:B.text,border:`1px solid ${B.border}`}} onClick={()=>setMode("menu")}>Volver al menú</button>
    </div>
  ); }

  if(mode==="ranking"){ const rk=[...LS.get("ranking")].sort((a,b)=>b.mejorPct-a.mejorPct); const medal=i=>i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}°`; return (
    <div>
      <button style={css.back} onClick={()=>setMode("menu")}>← Volver</button>
      <div style={{color:B.text,fontSize:18,fontWeight:800,marginBottom:6}}>🏆 Ranking del equipo</div>
      <div style={{color:B.muted,fontSize:12,marginBottom:20}}>Mejor puntaje de cada persona en el quiz BPM/HACCP</div>
      {rk.length===0&&<div style={{color:B.muted,textAlign:"center",padding:40}}>Todavía nadie completó el quiz.<br/>¡Sé el primero en el ranking!</div>}
      {rk.map((r,i)=>(
        <div key={r.userId} style={{...css.card,padding:"13px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:14,borderColor:r.userId===user.id?`${B.accent}60`:i<3?`${B.yellow}40`:B.border}}>
          <div style={{fontSize:i<3?22:16,fontWeight:800,color:i<3?B.yellow:B.muted,width:32,textAlign:"center"}}>{medal(i)}</div>
          <div style={{flex:1}}><div style={{color:B.text,fontWeight:700,fontSize:14}}>{r.nombre}{r.userId===user.id&&<span style={{color:B.muted,fontSize:11}}> (vos)</span>}</div><div style={{color:B.muted,fontSize:11,marginTop:2}}>{r.intentos} intento{r.intentos>1?"s":""} · últ. {fmt(r.ultima)}</div></div>
          <div style={{textAlign:"right"}}><div style={{color:r.mejorPct>=80?B.accent:r.mejorPct>=60?B.yellow:B.muted,fontSize:22,fontWeight:800}}>{r.mejorPct}%</div></div>
        </div>
      ))}
    </div>
  ); }

  // mode==="ai" (solo si IA_ENABLED)
  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 140px)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}><button style={{...css.back,marginBottom:0}} onClick={()=>setMode("menu")}>←</button><div><div style={{color:B.text,fontWeight:800,fontSize:15}}>Asistente Inocuidad</div><div style={{color:B.muted,fontSize:11}}>CAA · BPM · HACCP · ANMAT</div></div><div style={{marginLeft:"auto",width:7,height:7,borderRadius:"50%",background:B.accent}}/></div>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,marginBottom:10}}>
        {msgs.map((m,i)=>(<div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}><div style={{maxWidth:"82%",borderRadius:12,padding:"10px 14px",fontSize:13,lineHeight:1.5,background:m.role==="user"?B.accent:B.card,color:m.role==="user"?"#0A1A0C":B.text,border:m.role==="user"?"none":`1px solid ${B.border}`}}>{m.text}</div></div>))}
        {loading&&<div style={{display:"flex"}}><div style={{...css.card,padding:"10px 14px",color:B.muted,fontSize:13}}>Consultando…</div></div>}
        <div ref={ref}/>
      </div>
      <div style={{display:"flex",gap:8}}><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendAI()} placeholder="Consultá sobre inocuidad, BPM…" style={{flex:1,...css.input}}/><button onClick={sendAI} disabled={loading} style={{...css.btn,width:"auto",padding:"0 18px",fontSize:18,opacity:loading?0.5:1}}>→</button></div>
    </div>
  );
}

function Limpiezas({user}){

  const [q,setQ]=useState("");
  const zona=zonas.find(z=>z.id===zonaId);

  const startNew=()=>{ setZonaId(zonas[0]?.id||""); setOkItems({}); setObs(""); setView("form"); };

/* CONFIGURACIÓN DE ZONAS DE LIMPIEZA (admin) */
function ConfigZonas(){
  const [zonas,setZonas]=useState(()=>LS.get("zonas_limpieza"));
  const [view,setView]=useState("list");
  const [form,setForm]=useState({id:null,nombre:"",poes:"",items:[]});
  const [itemTxt,setItemTxt]=useState("");

  const persist=upd=>{ LS.set("zonas_limpieza",upd); setZonas(upd); };
  const nueva=()=>{ setForm({id:null,nombre:"",poes:"",items:[]}); setItemTxt(""); setView("form"); };
  const editar=z=>{ setForm({id:z.id,nombre:z.nombre,poes:z.poes||"",items:[...(z.items||[])]}); setItemTxt(""); setView("form"); };
  const addItem=()=>{ if(!itemTxt.trim())return; setForm(p=>({...p,items:[...p.items,itemTxt.trim()]})); setItemTxt(""); };
  const delItem=i=>setForm(p=>({...p,items:p.items.filter((_,idx)=>idx!==i)}));
  const save=()=>{
    if(!form.nombre.trim()) return alert("Poné un nombre de zona");
    let z;
    let upd;
    if(form.id){ z={id:form.id,nombre:form.nombre.trim(),poes:form.poes.trim(),items:form.items,activo:true}; upd=zonas.map(x=>x.id===form.id?z:x); }
    else { z={id:uid(),nombre:form.nombre.trim(),poes:form.poes.trim(),items:form.items,activo:true}; upd=[...zonas,z]; }
    persist(upd); pushZona(z); setView("list");
  };
  const borrar=z=>{ if(!window.confirm(`¿Eliminar la zona "${z.nombre}"? Los registros ya hechos se conservan.`))return; persist(zonas.filter(x=>x.id!==z.id)); delZona(z.id); };

  if(view==="form") return (
    <div>
      <button style={css.back} onClick={()=>setView("list")}>← Volver</button>
      <div style={{color:B.text,fontSize:16,fontWeight:800,marginBottom:14}}>{form.id?"Editar":"Nueva"} zona de limpieza</div>
      <Field label="Nombre de la zona *"><input style={css.input} value={form.nombre} onChange={e=>setForm(p=>({...p,nombre:e.target.value}))} placeholder="Ej. Cámara de frío"/></Field>
      <Field label="POES asociado"><input style={css.input} value={form.poes} onChange={e=>setForm(p=>({...p,poes:e.target.value}))} placeholder="Ej. POES-05"/></Field>
      <div style={css.sec}>Ítems de chequeo</div>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <input style={{...css.input,flex:1}} value={itemTxt} onChange={e=>setItemTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()} placeholder="Escribí un ítem y Enter"/>
        <button style={{...css.btn,width:"auto",padding:"0 16px"}} onClick={addItem}>+</button>
      </div>
      {form.items.length===0&&<div style={{color:B.muted,fontSize:12,marginBottom:10}}>Agregá los ítems que el operario deberá tildar al limpiar esta zona.</div>}
      {form.items.map((it,i)=>(
        <div key={i} style={{...css.card,padding:"9px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:B.text,fontSize:13}}>{it}</span>
          <button onClick={()=>delItem(i)} style={{background:"none",border:"none",color:B.red,cursor:"pointer",fontSize:16}}>×</button>
        </div>
      ))}
      <button style={{...css.btn,marginTop:14}} onClick={save}>Guardar zona</button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div><div style={{color:B.text,fontSize:16,fontWeight:800}}>🧼 Zonas de limpieza</div><div style={{color:B.muted,fontSize:12}}>Configurá zonas, POES e ítems de chequeo</div></div>
        <button style={{...css.btn,width:"auto",padding:"9px 14px",fontSize:13}} onClick={nueva}>+ Nueva</button>
      </div>
      {zonas.length===0&&<div style={{color:B.muted,textAlign:"center",padding:40}}>Sin zonas configuradas.</div>}
      {zonas.map(z=>(
        <div key={z.id} style={{...css.card,padding:"13px 14px",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{color:B.text,fontWeight:700,fontSize:14}}>{z.nombre}</div>
              <div style={{color:B.muted,fontSize:11,marginTop:2}}>{z.poes||"sin POES"} · {(z.items||[]).length} ítem(s)</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>editar(z)} style={{...css.btnSm,padding:"5px 10px"}}>Editar</button>
              <button onClick={()=>borrar(z)} style={{...css.btnSm,padding:"5px 10px",color:B.red,borderColor:`${B.red}40`}}>Borrar</button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}
